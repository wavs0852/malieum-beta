  <body>
    <div id="root"></div>
    <script>
      (function () {
        var bootParam = '__listener_boot'
        if (window.location.pathname.indexOf('/session/') !== 0) return

        var url = new URL(window.location.href)
        if (url.searchParams.get(bootParam) === '1') return

        url.searchParams.set(bootParam, '1')
        url.searchParams.set('_', Date.now().toString())
        window.location.replace(url.toString())
      })()
    </script>
  </body>
